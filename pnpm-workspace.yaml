strictDepBuilds: true
dangerouslyAllowAllBuilds: false
# Native binaries via postinstall — reviewed exceptions from the empty allowBuilds baseline.
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAge: 10080 # 7 days, in minutes
minimumReleaseAgeStrict: true # fail instead of falling back to a too-new version
minimumReleaseAgeIgnoreMissingTime: false # missing publish-time metadata fails closed
blockExoticSubdeps: true
trustPolicy: no-downgrade # fail if a later version has weaker trust evidence
# Vitest 5 depends on why-is-node-running ^3.2.1. 3.2.2 is a trust downgrade.
# Minimum versions for transitive dependencies that parent releases do not force.
overrides:
  why-is-node-running: 3.2.1
  "undici@7": ">=7.29.1 <8"
  "brace-expansion@1": ">=1.1.19 <2"
  "brace-expansion@5": ">=5.0.11"
  "postcss@8": ">=8.5.18"
  "nanoid@3": ">=3.3.18 <4"
  "source-map-js": ">=1.2.2"
  "vite@7": ">=7.3.2 <8"
