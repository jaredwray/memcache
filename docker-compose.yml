services:
  memcached1:
    image: memcached:1.6.45@sha256:75c93cc91e76853da7c029e74d6e8dbd44774dd3713c93be8cd1971ad26120a4
    container_name: memcached-server-1
    ports:
      - "11211:11211"
    command: memcached -m 64 -vv
    restart: unless-stopped

  memcached2:
    image: memcached:1.6.45@sha256:75c93cc91e76853da7c029e74d6e8dbd44774dd3713c93be8cd1971ad26120a4
    container_name: memcached-server-2
    ports:
      - "11212:11211"
    command: memcached -m 64 -vv
    restart: unless-stopped

  memcached3:
    image: memcached:1.6.45@sha256:75c93cc91e76853da7c029e74d6e8dbd44774dd3713c93be8cd1971ad26120a4
    container_name: memcached-server-3
    ports:
      - "11213:11211"
    command: memcached -m 64 -vv
    restart: unless-stopped

  # Reserved for tests that clear the whole server (flush_all). Test files run
  # in parallel against memcached1, so flushing it can wipe keys that other
  # tests are in the middle of using.
  memcached-flush:
    image: memcached:1.6.45@sha256:75c93cc91e76853da7c029e74d6e8dbd44774dd3713c93be8cd1971ad26120a4
    container_name: memcached-server-flush
    ports:
      - "11214:11211"
    command: memcached -m 64 -vv
    restart: unless-stopped

  # TLS-only target for test/tls.test.ts — mirrors ElastiCache Serverless
  # constraints: TLS mandatory, ascii protocol only, no UDP. Certs are
  # checked in (test-only); regenerate via test/certs/make-certs.sh.
  memcached-tls:
    image: memcached:1.6.45@sha256:75c93cc91e76853da7c029e74d6e8dbd44774dd3713c93be8cd1971ad26120a4
    container_name: memcached-server-tls
    ports:
      - "21211:11211"
    command: memcached -m 64 -Z -o ssl_chain_cert=/certs/server_crt.pem -o ssl_key=/certs/server_key.pem -o ssl_session_cache -B ascii -U 0
    volumes:
      - ./test/certs:/certs:ro
    restart: unless-stopped

  # Targets for benchmark/perf.ts. The bench profile keeps them out of
  # test:services:start; use `pnpm benchmark:services:start`. They run without
  # -vv (per-command logging caps throughput) and with -I 32m for large values.
  memcached-bench:
    image: memcached:1.6.45@sha256:75c93cc91e76853da7c029e74d6e8dbd44774dd3713c93be8cd1971ad26120a4
    container_name: memcached-server-bench
    profiles: ["bench"]
    ports:
      - "11216:11211"
    command: memcached -m 256 -I 32m
    restart: unless-stopped

  memcached-bench-tls:
    image: memcached:1.6.45@sha256:75c93cc91e76853da7c029e74d6e8dbd44774dd3713c93be8cd1971ad26120a4
    container_name: memcached-server-bench-tls
    profiles: ["bench"]
    ports:
      - "21216:11211"
    command: memcached -m 256 -I 32m -Z -o ssl_chain_cert=/certs/server_crt.pem -o ssl_key=/certs/server_key.pem -o ssl_session_cache -B ascii -U 0
    volumes:
      - ./test/certs:/certs:ro
    restart: unless-stopped

  memcached-sasl:
    build:
      context: ./test/sasl
      dockerfile: Dockerfile
    container_name: memcached-server-sasl
    ports:
      - "11215:11211"
    restart: unless-stopped

  # TLS + SASL — ElastiCache-style in-transit encryption plus AUTH.
  # Reuses the SASL image (PLAIN) with the TLS test certs mounted.
  memcached-tls-sasl:
    build:
      context: ./test/sasl
      dockerfile: Dockerfile
    container_name: memcached-server-tls-sasl
    ports:
      - "21215:11211"
    command: memcached -m 64 -vv -S -Z -o ssl_chain_cert=/certs/server_crt.pem -o ssl_key=/certs/server_key.pem -o ssl_session_cache -U 0 -u root
    volumes:
      - ./test/certs:/certs:ro
    restart: unless-stopped